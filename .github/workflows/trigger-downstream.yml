name: Trigger downstream build

on:
  push:
    branches:
      - master

jobs:
  trigger:
    # The target repository and the runner are on the JPL GitHub Enterprise
    # server, so do nothing anywhere else (for example the public repository).
    if: github.server_url == 'https://github.jpl.nasa.gov'
    runs-on: jpl-linux-x64

    steps:
      - name: Trigger build workflow in downstream
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOWNSTREAM_PAT }}" \
            https://github.jpl.nasa.gov/api/v3/repos/refractor/build_supplement/dispatches \
            -d '{"event_type":"run-build"}'
